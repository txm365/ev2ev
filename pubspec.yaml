name: eve2ev
description: Electric Vehicle (EV) route planner and charging station locator.

version: 1.0.0+2

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Existing ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.1
  geolocator: ^10.1.0
  flutter_map: ^8.1.1
  flutter_map_cache: ^2.0.0
  dio_cache_interceptor: ^4.0.6
  dio: ^5.8.0
  latlong2: ^0.9.0
  http: ^1.1.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.3
  permission_handler: ^11.4.0
  flutter_polyline_points: ^2.1.0
  intl: ^0.18.1
  vector_math: ^2.1.4
  flutter_svg: ^2.0.0+1
  flutter_animate: ^4.1.1+1
  supabase_flutter: ^2.3.0
  google_sign_in: ^6.1.5
  intl_phone_field: ^3.1.0
  cupertino_battery_indicator: ^1.0.0
  badges: ^3.1.2
  url_launcher: ^6.2.2

  # ── Blockchain (new) ──────────────────────────────────────────────────────
  # Ethereum/Polygon interaction — send signed transactions, call contracts
  web3dart: ^2.7.3

  # Encrypted on-device key storage (Android Keystore / iOS Secure Enclave)
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # BIP39 mnemonic generation and seed derivation
  bip39: ^1.0.6

  # HD key derivation (BIP32 / BIP44)
  ed25519_hd_key: ^2.2.0

  # QR code display (for wallet address sharing / receiving MATIC)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3   # QR code scanning via camera

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ev2ev_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/ev2ev_icon.png"

flutter_native_splash:
  color: "#0D1F0D"        # matches logo disc background
  image: assets/icon/ev2ev_icon.png
  color_dark: "#0A1A0A"   # slightly deeper for dark mode
  image_dark: assets/icon/ev2ev_icon.png
  android_12:
    image: assets/icon/ev2ev_icon.png
    color: "#2E7D32"
    image_dark: assets/icon/ev2ev_icon.png
    color_dark: "#1B5E20"
  fullscreen: false